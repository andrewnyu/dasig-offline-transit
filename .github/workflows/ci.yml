name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run precheck
      - run: python scripts/build_mobile_pack.py
      - run: git diff --exit-code -- src/data/bacolod-network.json
      - run: python -m pip install -r server/requirements-dev.txt
      - run: pytest -q server
